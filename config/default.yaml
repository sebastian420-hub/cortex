# Default configuration for Cortex.
#
# Every key below is a real setting. Unknown keys are reported at startup instead of being
# silently ignored. Environment variables (CORTEX_MODEL, CORTEX_MODE, ...) override this file,
# and command-line flags override both.

model: moonshotai/kimi-k2.5
permission_mode: normal   # normal (ask before changes) | auto_approve | plan (read-only)
max_iterations: 15

# Context window size (in tokens)
# Set to 'auto' to automatically detect based on model capabilities
# Or specify a number to use a fixed limit
# Examples: auto, 100000, 200000
max_tokens: auto

keep_recent_messages: 20
auto_save: false

# Provider settings (auto-detected from model name if not specified)
# provider: null  # "ollama" | "deepseek" | "anthropic" | "openrouter" | "openai" | null (auto-detect)

# API keys are read from environment variables:
# - OPENROUTER_API_KEY (OpenRouter models, including the default)
# - DEEPSEEK_API_KEY (DeepSeek models)
# - ANTHROPIC_API_KEY (Claude models)
# - OPENAI_API_KEY (OpenAI), or just OPENAI_BASE_URL for a local OpenAI-compatible server
# Ollama doesn't require API keys

# Local models: the context window the server really gives the model. Cortex sizes its history to
# it. Environment variables win over these.
# ollama:
#   num_ctx: 32768           # requested from Ollama (CORTEX_OLLAMA_NUM_CTX)
# openai:                    # --provider openai: vLLM, llama.cpp, LM Studio, OpenAI
#   base_url: http://gpu-box:8000/v1   # (OPENAI_BASE_URL)
#   context_window: 65536    # what the server was started with (CORTEX_OPENAI_CONTEXT_WINDOW)

# Optional agent features. All are off by default; each also has a command-line flag.
enable_planning: false         # --planning: create_and_execute_plan / monitor_plan / update_plan
enable_layered_memory: false   # --memory: failed approaches, successful patterns, insights
enable_metacognition: false    # --metacognition (experimental): confidence/urgency/tone in prompt

# Semantic (vector) memory across sessions. Requires: pip install 'cortex[memory]'
# It only has an effect together with enable_layered_memory.
semantic_memory:
  enabled: false
  # persist_directory: .cortex/semantic_db   # relative to the working directory

# Parallel execution settings
parallel_execution:
  enabled: true
  # max_workers: Number of concurrent workers for parallel tool execution
  # Set to 0 or "auto" for automatic detection (min(4, cpu_count))
  # Recommended: 2-8 depending on your hardware
  max_workers: 0  # 0 = auto-detect based on CPU count
  # batch_size: Maximum tools to execute in a single parallel batch
  batch_size: 10

# Tool configuration
# tools_plugins: List of plugin modules to load
# tools_plugins:
#   - "my_plugins.custom_tools"
#   - "examples.plugins.simple_tool"
tools_plugins: []

# Tools to disable
# tools_disabled:
#   - "web_search"
#   - "web_fetch"
tools_disabled: []

# Feature flags for the optional native (Rust/Go) components. All off by default.
feature_flags:
  rust_search: false
  rust_ast: false
  rust_tokenizer: false
  go_cache: false
  go_model_manager: false
