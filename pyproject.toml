[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex"
version = "1.2.0"
description = "A terminal coding agent with undoable changes, honest results and an optional command sandbox"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Cortex Contributors", email = "contributors@cortex.ai"}
]
keywords = ["ai", "coding-assistant", "agent", "llm", "ollama", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

dependencies = [
    "ollama>=0.1.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pyyaml>=6.0",
    "tiktoken>=0.5.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "ddgs>=9.0.0",
    "python-dotenv>=1.0.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-go>=0.21.0",
]

[project.optional-dependencies]
# Semantic (vector) memory. Heavy: sentence-transformers pulls in PyTorch. Off by default.
memory = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0",
    "mypy>=1.0",
    "black>=23.0",
    "flake8>=6.0",
    "pre-commit>=3.0",
]
hybrid = [
    "maturin>=1.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
]

[project.scripts]
cortex = "cortex.cli:main"

[project.urls]
Homepage = "https://github.com/sebastian420-hub/cortex"
Documentation = "https://github.com/sebastian420-hub/cortex#readme"
Repository = "https://github.com/sebastian420-hub/cortex"

[tool.setuptools.packages.find]
where = ["."]
include = ["cortex*"]

# Non-Python files that must ship inside the wheel (the skills are loaded at runtime).
[tool.setuptools.package-data]
cortex = ["py.typed", "*.pyi", "skills/*.md"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "silent"
# The modules that are held to a clean type check (`mypy` with no arguments checks exactly these;
# CI fails if they regress). It is a list of what is clean today, not of what matters: grow it.
files = [
    "cortex/core/turn.py",
    "cortex/headless",
    "cortex/core/tool_policy.py",
    "cortex/core/checkpoints.py",
    "cortex/core/command_sandbox.py",
    "cortex/core/transaction.py",
    "cortex/core/planning.py",
    "cortex/core/loop_guards.py",
    "cortex/core/agent_permissions.py",
    "cortex/core/security.py",
    "cortex/core/context.py",
    "cortex/core/conversation.py",
    "cortex/core/memory/contract.py",
    "cortex/core/memory/core_memory.py",
    "cortex/core/memory_layers/session.py",
    "cortex/core/memory_layers/state.py",
    "cortex/core/providers/usage.py",
    "cortex/core/gym/manager.py",
    "cortex/utils/message_validation.py",
    "cortex/tools/memory_tools.py",
    "cortex/tools/skill_tools.py",
    "cortex/cli_commands/commands/transaction.py",
    "cortex/cli_commands/commands/gym.py",
    "cortex/cli_commands/commands/memory.py",
    "bench",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

