[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --strict-config
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    security: marks tests as security tests
    performance: marks tests as performance benchmarks
    web: marks tests that require network/web access
    cloud: marks tests that require cloud provider access
    mcp: marks tests that require MCP server access
    enhanced: marks tests for enhanced agent features
    unit: marks tests as unit tests
    functional: marks tests as functional tests
    benchmark: marks benchmark tests (requires pytest-benchmark)