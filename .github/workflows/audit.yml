name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight
  push:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'setup.py'
  workflow_dispatch:  # Manual trigger

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pip-audit safety bandit

      - name: Run pip-audit
        run: |
          pip-audit --format=json --output=pip-audit-report.json || true
          pip-audit --format=markdown --output=pip-audit-report.md || true
          cat pip-audit-report.md

      - name: Run safety check
        run: |
          safety check --full-report --output=json > safety-report.json || true
          safety check --full-report

      - name: Run bandit security scan
        run: |
          bandit -r cortex -f json -o bandit-report.json || true
          bandit -r cortex -f txt

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-reports
          path: |
            pip-audit-report.json
            pip-audit-report.md
            safety-report.json
            bandit-report.json

      - name: Create issue on vulnerabilities
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let body = '## Security Audit Failed\n\n';
            body += 'The weekly security audit found potential vulnerabilities.\n\n';
            body += 'Please review the attached reports and update dependencies as needed.\n\n';
            body += `Run: \`${new Date().toISOString()}\`\n`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,automated'
            });

            const existingIssue = issues.data.find(i =>
              i.title === 'Security Audit: Vulnerabilities Found'
            );

            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Security Audit: Vulnerabilities Found',
                body: body,
                labels: ['security', 'automated']
              });
            }
