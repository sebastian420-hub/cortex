name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # Test job - runs on multiple OS and Python versions
  # ============================================
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-test.txt

      # The coverage floor lives in .coveragerc (fail_under). Nothing is omitted from it to make it
      # reachable: memory, planning, permissions, the agent and the CLI all count.
      - name: Run tests with coverage
        run: |
          pytest tests/ -q --junitxml=junit.xml --cov=cortex --cov-report=xml --cov-report=term-missing

      # Test counts and coverage are generated here, never typed into the README.
      - name: Summarise results
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python scripts/test_summary.py junit.xml coverage.xml --out summary > summary.txt || true
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: summary/

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================
  # Smoke test - a clean base install must start every way a user starts it
  # ============================================
  smoke:
    name: Smoke (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (base install, no extras)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: cortex --help
        run: cortex --help

      - name: python -m cortex --version
        run: python -m cortex --version

      - name: Package imports without the optional memory extra
        run: python -c "import cortex, sys; assert 'chromadb' not in sys.modules; print(cortex.__version__)"

  # ============================================
  # Native components - Rust extension and Go services
  # ============================================
  rust:
    name: Rust tests (cortex-native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (PyO3 links against it)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/cortex-native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/cortex-native/Cargo.lock') }}

      - name: Run Rust tests
        working-directory: rust/cortex-native
        run: cargo test

      - name: Build the Python wheel
        run: |
          pip install maturin
          cd rust/cortex-native && maturin build

  go:
    name: Go tests (cortex-services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Vet and test
        working-directory: go
        run: |
          go vet ./...
          go test ./... -count=1

  # ============================================
  # Lint job - code quality checks
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black==26.5.1 flake8 mypy types-PyYAML
          pip install -e .

      - name: Check formatting with black
        run: black --check cortex tests bench

      # Undefined names (F821) and unused variables (F841) are errors. The remaining ignores are
      # known debt, not policy: F401 (unused imports, many are re-exports), E402, E712, and the
      # two rules black disagrees with (E203, W503) plus line length (black owns that).
      - name: Lint with flake8
        run: flake8 cortex tests bench --max-line-length=120 --extend-ignore=E203,W503,E501,F401,E402,E712

      # The files listed under [tool.mypy] files in pyproject.toml are type-clean and must stay so.
      - name: Type check (blocking set)
        run: mypy

      - name: Type check (the rest of cortex, advisory)
        run: mypy cortex --ignore-missing-imports --no-error-summary
        continue-on-error: true  # existing debt: shrink it, then move files into the blocking set

  # ============================================
  # Benchmark tasks - each must fail as shipped and pass when solved (no model involved)
  # ============================================
  bench:
    name: Benchmark tasks are sound
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Verify the tasks
        run: python -m bench verify

  # ============================================
  # Docker image - builds, starts, runs as a non-root user
  # ============================================
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t cortex:ci .

      - name: Starts and reports its version
        run: docker run --rm cortex:ci --version

      - name: The python -m entry point works
        run: docker run --rm --entrypoint python cortex:ci -m cortex --version

      - name: Does not run as root
        run: test "$(docker run --rm --entrypoint id cortex:ci -u)" != "0"

      - name: git and ripgrep are present
        run: docker run --rm --entrypoint sh cortex:ci -c 'git --version && rg --version'

      - name: Optional memory extra is not pulled in
        run: docker run --rm --entrypoint python cortex:ci -c "import sys, cortex; assert 'chromadb' not in sys.modules"

  # ============================================
  # Badges - test count and coverage, generated from this run (main only)
  # ============================================
  publish-badges:
    name: Publish badges
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the test summary
        uses: actions/download-artifact@v4
        with:
          name: test-summary
          path: summary

      - name: Publish to the badges branch
        run: |
          git init badges-repo
          cd badges-repo
          git checkout -b badges
          cp ../summary/badges/*.json .
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" \
            commit -m "Badges for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges

  # ============================================
  # Security job - vulnerability scanning (BLOCKING)
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
          pip install -e .

      - name: Run bandit security scan
        run: |
          bandit -r cortex -ll -ii -f json -o bandit-report.json
          # Exit with error if high severity issues found
          bandit -r cortex -ll -ii

      - name: Check dependencies with safety
        run: safety check --full-report
        continue-on-error: true  # Allow to continue, report issues

      - name: Audit dependencies with pip-audit
        run: pip-audit --strict --progress-spinner=off
        continue-on-error: true  # Allow to continue, report issues

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json

  # ============================================
  # Coverage job - upload to Codecov
  # ============================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ============================================
  # Documentation build check
  # ============================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints myst-parser

      - name: Build documentation
        run: |
          cd docs/sphinx
          sphinx-build -b html -W --keep-going . _build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/sphinx/_build/html/

  # ============================================
  # Build check - ensure package builds correctly
  # ============================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
