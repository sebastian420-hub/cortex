name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # Test job - runs on multiple OS and Python versions
  # ============================================
  test:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=cortex --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ============================================
  # Smoke test - a clean base install must start every way a user starts it
  # ============================================
  smoke:
    name: Smoke (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package (base install, no extras)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: cortex --help
        run: cortex --help

      - name: python -m cortex --version
        run: python -m cortex --version

      - name: Package imports without the optional memory extra
        run: python -c "import cortex, sys; assert 'chromadb' not in sys.modules; print(cortex.__version__)"

  # ============================================
  # Native components - Rust extension and Go services
  # ============================================
  rust:
    name: Rust tests (cortex-native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (PyO3 links against it)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/cortex-native/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/cortex-native/Cargo.lock') }}

      - name: Run Rust tests
        working-directory: rust/cortex-native
        run: cargo test

      - name: Build the Python wheel
        run: |
          pip install maturin
          cd rust/cortex-native && maturin build

  go:
    name: Go tests (cortex-services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Vet and test
        working-directory: go
        run: |
          go vet ./...
          go test ./... -count=1

  # ============================================
  # Lint job - code quality checks
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy
          pip install -e .

      - name: Check formatting with black
        run: black --check cortex tests

      - name: Lint with flake8
        run: flake8 cortex tests --max-line-length=120 --extend-ignore=E203,W503,E501,F401,E402,F841,E302,E305,E261,W391,E712,F811,F541,E301,E303,F824,E127,F821

      - name: Type check with mypy
        run: mypy cortex --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Non-blocking until strict mode enabled

  # ============================================
  # Security job - vulnerability scanning (BLOCKING)
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
          pip install -e .

      - name: Run bandit security scan
        run: |
          bandit -r cortex -ll -ii -f json -o bandit-report.json
          # Exit with error if high severity issues found
          bandit -r cortex -ll -ii

      - name: Check dependencies with safety
        run: safety check --full-report
        continue-on-error: true  # Allow to continue, report issues

      - name: Audit dependencies with pip-audit
        run: pip-audit --strict --progress-spinner=off
        continue-on-error: true  # Allow to continue, report issues

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json

  # ============================================
  # Coverage job - upload to Codecov
  # ============================================
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # ============================================
  # Documentation build check
  # ============================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install sphinx sphinx-rtd-theme sphinx-autodoc-typehints myst-parser

      - name: Build documentation
        run: |
          cd docs/sphinx
          sphinx-build -b html -W --keep-going . _build/html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/sphinx/_build/html/

  # ============================================
  # Build check - ensure package builds correctly
  # ============================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
